services:

  # ── Instancias del frontend (no expuestas al host) ──────────────────────────
  frontend1:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - frontend_net
    restart: unless-stopped

  frontend2:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - frontend_net
    restart: unless-stopped

  frontend3:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - frontend_net
    restart: unless-stopped

  # ── Load balancer (único punto de entrada público) ───────────────────────────
  loadbalancer:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/loadbalancer.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend1
      - frontend2
      - frontend3
    networks:
      - frontend_net
    restart: unless-stopped

networks:
  frontend_net:
    # Red interna: las instancias del frontend son visibles entre sí
    # pero no desde el host (sin "ports" expuestos)
    driver: bridge
