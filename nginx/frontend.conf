server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: cualquier ruta desconocida sirve index.html (Angular Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash (Angular outputHashing=all): cache agresivo e inmutable
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Archivos i18n: sin cache para facilitar actualizaciones de traducción
    location /i18n/ {
        add_header Cache-Control "no-cache";
    }

    # Evitar exponer información del servidor
    server_tokens off;
}
