upstream frontend_pool {
    # least_conn: envía la siguiente request al servidor con menos conexiones activas.
    # Cambiar a "round_robin" (por defecto en nginx) simplemente eliminando esta línea.
    least_conn;

    server frontend1:80;
    server frontend2:80;
    server frontend3:80;

    # keepalive: mantiene conexiones abiertas hacia los upstreams para reducir latencia
    keepalive 32;
}

server {
    listen 80;
    server_tokens off;

    location / {
        proxy_pass http://frontend_pool;

        # Headers para que el upstream sepa la IP y protocolo real del cliente
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Necesario para keepalive con upstream
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Timeouts razonables para una SPA estática
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # Endpoint de health check del load balancer (útil para monitoreo futuro)
    location /lb-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
