<div class="pnf-wrapper">
  <div class="pnf-card">

    <div class="pnf-illustration" aria-hidden="true">
      <span class="pnf-code">404</span>
      <div class="pnf-crop-row"></div>
    </div>

    <h1 class="text-2xl font-bold text-center leading-tight mb-3">
      {{ 'page-not-found.title' | translate }}
    </h1>

    <p class="text-secondary text-center leading-relaxed mb-8"
       [innerHTML]="'page-not-found.content' | translate: { invalid_path: invalidPath }">
    </p>

    <button mat-raised-button
            color="primary"
            class="pnf-btn"
            (click)="navigateToHome()">
      {{ 'page-not-found.go-home' | translate }}
    </button>

  </div>
</div>
