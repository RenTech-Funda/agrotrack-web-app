<header>
  <mat-toolbar>
    <mat-toolbar-row class="flex-between">

      <div class="flex-center gap-3">
        <button mat-icon-button
                class="toolbar-toggle"
                aria-label="Toggle navigation menu"
                (click)="toggleMenu()">
          <mat-icon>menu</mat-icon>
        </button>
        <img ngSrc="assets/images/agrotrack-fullLogo.png"
             alt="AgroTrack"
             width="160"
             height="40"
             priority />
      </div>

      <div class="flex-center gap-2">
        <app-profile></app-profile>
        <app-language-switcher></app-language-switcher>
      </div>

    </mat-toolbar-row>
  </mat-toolbar>
</header>

<mat-sidenav-container autosize>

  <mat-sidenav
    role="navigation"
    mode="side"
    [opened]="true"
    [class.collapsed]="isCollapsed"
    [attr.aria-expanded]="!isCollapsed"
    aria-label="Main navigation"
  >
    <div class="sidenav-body">
      <mat-nav-list>
        @for (opt of options; track opt.route) {
          <a
            mat-list-item
            [routerLink]="opt.route"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: true }"
            [attr.aria-label]="(opt.labelKey | translate)"
            [matTooltip]="isCollapsed ? (opt.labelKey | translate) : ''"
            matTooltipPosition="right"
          >
            <mat-icon matListItemIcon>{{ opt.icon }}</mat-icon>
            @if (!isCollapsed) {
              <span matListItemTitle>{{ opt.labelKey | translate }}</span>
            }
          </a>
        }
      </mat-nav-list>
    </div>

    <div class="sidenav-footer">
      <mat-nav-list>
        <a
          mat-list-item
          class="logout-item"
          role="button"
          (click)="logout()"
          aria-label="Cerrar Sesión"
          [matTooltip]="isCollapsed ? 'Cerrar Sesión' : ''"
          matTooltipPosition="right"
        >
          <mat-icon matListItemIcon>logout</mat-icon>
          @if (!isCollapsed) {
            <span matListItemTitle>Cerrar Sesión</span>
          }
        </a>
      </mat-nav-list>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <main>
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>

</mat-sidenav-container>
